version: 2

# Automated dependency-update PRs. Gradle updates cover the version catalog
# (gradle/libs.versions.toml) and build scripts; github-actions covers the
# action versions pinned in .github/workflows/. PRs target `develop` (the
# integration branch where CI + review happen), matching the normal flow.
#
# EDITING THIS FILE: Dependabot reads it from the repository's DEFAULT branch — not from the
# `target-branch` its PRs are opened against. The default branch is currently `develop`, so an edit
# merged here is live on the next run. It has not always been: when the default was `main`, the
# `androidx-platform` group added in #90 sat on `develop` doing nothing until the v1.0.2 promotion
# (#97) carried it over. If a config change appears to have no effect, check which branch is
# actually the default before concluding anything — and see the note on precedence below, because
# that has also masqueraded as "the config never arrived".
#
# GROUP PRECEDENCE IS BY SPECIFICITY, NOT BY DECLARATION ORDER. GitHub's docs say a dependency
# joins "the first group it matches". dependabot-core does not do that. It offers every dependency
# to every group it matches and skips a group only when some other matching group scores higher in
# PatternSpecificityCalculator:
#
#   exact dependency name          1000
#   pattern with no wildcard        500
#   GROUP WITH NO `patterns` KEY    500   <- the trap
#   wildcard pattern                100 - 10*(number of *) + max(len(pattern) - 5, 0)
#   the bare pattern "*"              1
#
# The comparison is also asymmetric, which is the other half of the trap: `can_check_specificity?`
# bails out on a group whose `patterns` is absent or empty, so such a group can never yield a
# dependency to anyone — it is only ever the winner, never a loser.
#
# `androidx-platform` was therefore inert from the day it was added (#90) until #106. Its wildcard
# patterns score 98-106 ("com.android.*" -> 98, "androidx.compose*" -> 102, "androidx.navigation:*"
# -> 106), so it yielded every one of them to a `gradle-minor-patch` that had no `patterns` key,
# scored a flat 500, and could not yield anything back. AGP and the Compose BOM landed in the
# routine-bump PR three weeks running (#103, #104, #106) and the platform group never opened one
# PR. Reordering the groups would not have helped; order is not consulted.
#
# The two rules on `gradle-minor-patch` below are what hold the split, and neither is cosmetic:
#   - `patterns: ["*"]` is NOT a no-op. Same set of dependencies as omitting the key, but it does
#     two things omitting the key cannot: it makes the group eligible to yield at all, and it scores
#     1 rather than 500, below any real pattern. Either alone would be insufficient.
#   - `exclude-patterns` removes the cohort from this group outright via `contains?`, independent of
#     any scoring, so the split survives a change to the scoring constants. Keep it a mirror of
#     `androidx-platform`'s `patterns`, and mind the asymmetry — the two drift directions are not
#     equally bad:
#       * a pattern added THERE but not here is harmless; `patterns: ["*"]` still routes it
#         correctly on specificity alone.
#       * a pattern added HERE but not there leaves that dependency in NO group — it opens its own
#         PR, every week, quietly. This is the one to watch.
updates:
  - package-ecosystem: gradle
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The compileSdk-/Kotlin-coupled platform cohort. These libraries must move together: the
      # AndroidX UI libraries' AAR metadata gates the project's compileSdk, the Compose compiler
      # tracks Kotlin, Glance is Compose-for-widgets, and AGP caps the maximum compileSdk. Bumping
      # one without the others produces the compileSdk-floor and binary-skew failures seen in #77 /
      # #87. Isolating them into their own PR means a single library raising the compileSdk floor
      # reddens only THIS PR (not the routine-bump PR below), and this PR becomes the standing
      # "platform upgrade needed" signal — handled deliberately (cf. #89), not merged blind.
      androidx-platform:
        patterns:
          - "com.android.*"                             # Android Gradle Plugin
          - "com.google.android.material:*"
          - "org.jetbrains.kotlin.*"                    # Kotlin + Compose-compiler Gradle plugins
          - "org.jetbrains.kotlinx:kotlinx-coroutines*"
          - "androidx.core:*"
          - "androidx.activity:*"
          - "androidx.navigation:*"
          - "androidx.lifecycle:*"
          - "androidx.compose*"                         # includes compose-bom
          - "androidx.glance:*"
          - "androidx.work:*"
        update-types:
          - minor
          - patch
      # Everything else (appcompat, datastore, the androidx.test libs, junit, robolectric, kover and
      # the Gradle wrapper): roll minor/patch into a single low-noise weekly PR. Major bumps still
      # open individually so they get a deliberate review. Note core-splashscreen is NOT in here —
      # it is `androidx.core:*`, so it moves with the platform cohort above.
      #
      # `patterns` + `exclude-patterns` are both load-bearing — see the precedence note at the top
      # of this file before simplifying either away.
      gradle-minor-patch:
        patterns:
          - "*"
        exclude-patterns:                               # mirror of androidx-platform's patterns
          - "com.android.*"
          - "com.google.android.material:*"
          - "org.jetbrains.kotlin.*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines*"
          - "androidx.core:*"
          - "androidx.activity:*"
          - "androidx.navigation:*"
          - "androidx.lifecycle:*"
          - "androidx.compose*"
          - "androidx.glance:*"
          - "androidx.work:*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Single group for this ecosystem, so there is nothing for it to lose a specificity contest
      # to; omitting `patterns` here is safe.
      github-actions:
        update-types:
          - minor
          - patch
