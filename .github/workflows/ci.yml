name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Cancel superseded PR runs so the slow emulator job isn't queued up multiple times over -- but
# never a push run. A push to develop/main is the record of whether that MERGED commit is green,
# and cancelling it leaves the commit unverified for good.
#
# Not hypothetical here: two push runs on develop have already been cancelled this way --
# c8ecf6a0 (2026-07-03, killed 22s in by a push 17s later) and 1eb2ab97 (2026-07-27, killed 57s in
# by a push 41s later). Both are on develop and neither was ever verified. With a median run of
# ~403s, a second push inside that window is the ordinary case, not a freak one: 9 of 74 push
# gaps are under 15 minutes.
#
# So pushes get a per-COMMIT group and never share a lane. A shared group would not be safe even
# with cancellation off: GitHub keeps only one PENDING run per group, so a third push would evict
# the second's queued run before it started. cancel-in-progress is then redundant for pushes, but
# it is kept explicit so the intent survives the next edit. (Matches QuasarApps/Aquifer's ci.yml,
# which already had this right.)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debug:
    name: debug build + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Match the Gradle daemon JVM pinned in gradle/gradle-daemon-jvm.properties (JetBrains
      # Runtime 21). Providing JBR 21 here lets Gradle reuse this JDK for the build daemon instead
      # of auto-provisioning JBR from the foojay download URLs on every cold run.
      - name: Set up JBR 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # koverVerify enforces the coverage floor (configured in app/build.gradle.kts); it reuses the
      # testDebugUnitTest run above for coverage data.
      - name: assembleDebug + unit tests + coverage gate
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:koverVerify --no-daemon --stacktrace

  # Build the release variant and run release-mode lint in parallel with the
  # debug job so R8 / ProGuard rule regressions and policy-level lint findings
  # (icons, exported components, etc.) surface in PR CI instead of the night
  # before publish. The release APK here is intentionally unsigned — Play Store
  # uploads use a separately-signed build.
  release:
    name: release build + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Match the Gradle daemon JVM pinned in gradle/gradle-daemon-jvm.properties (JetBrains
      # Runtime 21). Providing JBR 21 here lets Gradle reuse this JDK for the build daemon instead
      # of auto-provisioning JBR from the foojay download URLs on every cold run.
      - name: Set up JBR 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: assembleRelease + lintRelease
        run: ./gradlew :app:assembleRelease :app:lintRelease --no-daemon --stacktrace

      # Assert that the constructors only reachable by reflection survived R8. Two shipped Play
      # builds have been broken by R8 stripping one (the WorkDatabase_Impl launch crash, then the
      # OverwritingInputMerger failure that made every widget invisible) and neither was catchable by
      # a test, because debug builds skip R8 entirely. This reads the R8 seeds report the step above
      # just produced, so it costs nothing and fails the build instead of the release.
      - name: Verify reflective entry points survived R8
        run: ./scripts/verify-release-keeps.sh

      - name: Upload release lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-release-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore

  # Run the androidTest (instrumentation) suite on Gradle Managed Devices (GMD). The devices are
  # declared in app/build.gradle.kts, so AGP provisions/boots/tears down the emulator and the exact
  # same `:app:pixel2api<NN>DebugAndroidTest` command runs here and locally. Kept as its own job so
  # its slowness doesn't gate the fast JVM jobs.
  #
  # Matrix over API levels, same Pixel 2 profile on both, so the legs differ by platform version
  # only: 30 is the old-platform coverage (minSdk 26 era), 36 exercises the Android 16 behavior
  # changes the app opts into via targetSdk 36 (predictive back, edge-to-edge enforcement).
  # fail-fast disabled so one leg's emulator flake doesn't cancel the other's evidence.
  instrumentation:
    name: instrumentation tests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Match the Gradle daemon JVM pinned in gradle/gradle-daemon-jvm.properties (JetBrains
      # Runtime 21). Providing JBR 21 here lets Gradle reuse this JDK for the build daemon instead
      # of auto-provisioning JBR from the foojay download URLs on every cold run.
      - name: Set up JBR 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The emulator needs hardware acceleration; expose /dev/kvm to the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # GMD's setup task downloads the ATD system image via sdkmanager, which is licence-gated.
      # Accept all SDK licences up front so the install isn't blocked. (`yes` gets SIGPIPE once
      # sdkmanager stops reading, so the pipe's non-zero exit is expected and ignored.) Accepting
      # *all* licences matters: the android-36 aosp_atd image currently ships under the preview
      # licence, not the regular android-sdk-license the API 30 image uses.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Runner default env vars (ANDROID_SDK_ROOT) aren't available in the ${{ env.* }} expression
      # context, so re-export the SDK root into the job env. Without this the cache `path` below
      # resolves to "/system-images/..." and silently no-ops, re-downloading the image every run.
      - name: Expose SDK path
        run: echo "SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      # Cache the downloaded ATD system image (the slow part). The managed device itself is recreated
      # and booted fresh each run, which is reliable — it avoids the cross-run emulator-snapshot
      # fragility that a booted-snapshot cache is prone to.
      #
      # Key suffix `-v2`: a hosted-runner tooling bump left AGP's managed-device setup
      # (`:app:<device>Setup`) failing with `MissingValueException` against the previously-cached
      # image. Busting the key forces a fresh image download under the current tooling.
      - name: Cache ATD system image
        uses: actions/cache@v6
        with:
          path: ${{ env.SDK_ROOT }}/system-images/android-${{ matrix.api }}/aosp_atd
          key: gmd-system-image-aosp-atd-${{ matrix.api }}-v2

      # Install the emulator runtime, platform-tools and the ATD system image up front instead of
      # relying on AGP's managed-device setup to auto-resolve them. When a runner tooling update
      # leaves one of those components unresolved, AGP's setup task throws an opaque
      # `MissingValueException`; installing them explicitly here keeps the setup deterministic.
      # (Pixel 2 + aosp-atd on a 64-bit runner resolves to the x86_64 image. The x86 fallback is
      # API 30-only: an x86 package doesn't exist for android-36, so falling back there would just
      # shadow the real x86_64 install error with a "package not found". The android-36 image also
      # requires emulator >= 35.4.9, which installing "emulator" fresh here satisfies.)
      - name: Install emulator + ATD system image
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "emulator" "platform-tools"
          if [ "${{ matrix.api }}" -eq 30 ]; then
            "$SDKMANAGER" "system-images;android-30;aosp_atd;x86_64" \
              || "$SDKMANAGER" "system-images;android-30;aosp_atd;x86"
          else
            "$SDKMANAGER" "system-images;android-${{ matrix.api }};aosp_atd;x86_64"
          fi

      # Force software GPU (swiftshader_indirect). Headless runners have no GPU, and newer emulator
      # builds reject AGP's default `auto-no-window` mode ("Selected GPU option 'auto-no-window' is
      # not valid, switching to 'auto'") then fail to boot the managed device during :app:<device>Setup.
      # See https://developer.android.com/studio/test/managed-devices (headless build servers).
      #
      # Retry the whole GMD run once before failing the job. Emulator instrumentation is occasionally
      # flaky — a single test can spuriously fail (e.g. a DataStore-round-trip timeout/async hiccup)
      # under CI load even when the suite is sound. A genuinely broken test still fails both attempts,
      # so this only absorbs transient flakes; it doesn't mask real regressions.
      - name: Instrumentation tests (Gradle Managed Device)
        run: |
          gmd() {
            ./gradlew -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
              :app:pixel2api${{ matrix.api }}DebugAndroidTest --no-daemon --stacktrace
          }
          if gmd; then
            exit 0
          fi
          echo "::warning::Instrumentation run failed; retrying once before failing the job."
          gmd

      # Name suffixed per matrix leg: upload-artifact v4+ hard-fails on duplicate artifact names.
      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report-api${{ matrix.api }}
          path: app/build/reports/androidTests/**
          if-no-files-found: ignore
