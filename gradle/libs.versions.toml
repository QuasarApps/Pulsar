# Version catalog.
#
# A note on the comments here: Dependabot rewrites the VALUES and never the prose around them, so a
# comment that restates a version number goes stale the moment a bump lands — #94 bumped `agp` while
# the comment directly above it still read "AGP 9.3.0". Document the things that outlive any single
# version instead: minimum/maximum bounds, which refs have to move together, and why a floor exists.
# The current number is always on the next line anyway.

[versions]
# Android Gradle Plugin. Two constraints to re-check on every bump, because both can break the build
# in ways the version number alone won't reveal: AGP requires a minimum Gradle (currently >= 9.5.0 —
# see gradle/wrapper/gradle-wrapper.properties) and caps the maximum usable compileSdk (see
# app/build.gradle.kts). An AGP bump also ships a new R8, so it can change what gets stripped from
# the release build; scripts/verify-release-keeps.sh verifies the reflection-only entry points
# survived, and runs in the release CI job on every such bump.
agp = "9.3.1"

# Kotlin. The Compose compiler is applied via the org.jetbrains.kotlin.plugin.compose Gradle plugin
# (versioned with Kotlin), replacing the old kotlinCompilerExtensionVersion.
#
# Kotlin, the Compose BOM, AGP and compileSdk form one aligned platform cohort — the Compose compiler
# tracks Kotlin, and the AndroidX UI/lifecycle libs below gate the compileSdk floor. Move them
# together in a deliberate platform-upgrade PR (cf. #89), never piecemeal: a partial bump is what
# produced the compileSdk-floor and coroutines binary-skew failures in #77 and #87. Dependabot's
# `androidx-platform` group exists to keep this cohort in one PR, separate from routine bumps.
kotlin = "2.4.10"
coreKtx = "1.19.0"
# Splash screen API (Android 12 system splash, backported to API 23+).
coreSplashscreen = "1.2.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# Core on-device test infra (ApplicationProvider, ActivityScenario, ActivityScenarioRule).
# Declared low; Gradle upgrades to whatever androidx.test.ext:junit pulls transitively.
androidxTestCore = "1.7.0"
androidxTestRules = "1.7.0"
material = "1.14.0"
# Compose BOM: pins the Compose library versions. The Compose compiler itself tracks Kotlin (see [plugins]).
composeBom = "2026.06.01"
activityCompose = "1.13.0"
# Must support SDK 36: Robolectric's default test SDK follows the project targetSdk, so the whole
# JVM suite runs on the SDK 36 android-all jar. 4.16.x is the first line with stable SDK 36 support.
robolectric = "4.17"
# Compose-adjacent AndroidX libraries (navigation / lifecycle / datastore), versioned independently of
# the Compose BOM above.
navigationCompose = "2.9.8"
lifecycleViewmodelCompose = "2.11.0"
datastore = "1.2.1"
glance = "1.1.1"
# Deferred background work: periodic widget refresh.
work = "2.11.2"
# This one ref versions BOTH kotlinx-coroutines-android (an explicit app implementation dep) and
# kotlinx-coroutines-test. They MUST match: in the split-APK instrumented tests, coroutines-test resolves
# its runtime against the *app* APK's core, so a test artifact newer than the app's core throws
# NoSuchMethodError (e.g. BuildersKt.runBlockingK). Transitive AndroidX/Kotlin deps do NOT pull core up to
# this version on their own — the explicit coroutines-android dep (see app/build.gradle.kts) is what pins
# the app APK's core here. Bump both together, never just -test.
coroutines = "1.11.0"
# Kotlin code-coverage. 0.9.2+ is required for Gradle 9 — 0.8.x fails clean builds under Gradle 9
# (Kover doesn't create its tmp dir before writing kover-agent.args).
kover = "0.9.9"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Icons + downloadable Google Fonts are managed by the Compose BOM (no explicit version).
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
# lifecycle-runtime-compose: LocalLifecycleOwner + repeatOnLifecycle, for pausing foreground tickers.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
androidx-glance-testing = { group = "androidx.glance", name = "glance-testing", version.ref = "glance" }
androidx-glance-appwidget-testing = { group = "androidx.glance", name = "glance-appwidget-testing", version.ref = "glance" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Kotlin 2.0+ Compose compiler plugin (version tracks Kotlin).
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
